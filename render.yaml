# Render Blueprint — deploys the ORCA backend as a free web service.
# On render.com: New + -> Blueprint -> connect this GitHub repo -> Render
# reads this file automatically. After the first deploy, add your real
# GROQ_API_KEY as a secret in the Render dashboard (Environment tab) —
# never commit it here or anywhere in the repo.
services:
  - type: web
    name: orca-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
